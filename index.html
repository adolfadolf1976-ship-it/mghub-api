*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{background:#020306;color:#fff;display:flex;justify-content:center;min-height:100vh}#app{width:100%;max-width:390px;padding:20px;background:#0A0B0F;display:flex;flex-direction:column;min-height:100vh}h1{font-size:20px;font-weight:900;margin-bottom:4px}h2{font-size:18px;font-weight:900;margin-bottom:10px}h3{font-size:13px;font-weight:800;margin-bottom:8px}p{font-size:12px;color:#94a3b8;line-height:1.6;margin-bottom:12px}.cy{color:#00E5FF}.am{color:#FF9100}.rd{color:#FF3B3B}.mu{color:#64748b}.btn{width:100%;background:linear-gradient(90deg,#00E5FF,#0082FF);color:#0A0B0F;border:0;padding:14px;border-radius:12px;font-weight:900;font-size:12px;text-transform:uppercase;cursor:pointer;margin-top:auto;letter-spacing:.05em}.btn2{background:#161A22;color:#cbd5e1;border:1px solid #1F242E}.btn3{background:#3B1414;color:#fca5a5;border:1px solid #FF3B3B55}.card{background:#0F1218;border:1px solid #1F242E;border-radius:14px;padding:14px;margin-bottom:10px}.card.p{border-color:#00E5FF55;background:#00E5FF0D}.chk{display:flex;gap:8px;font-size:11px;color:#cbd5e1;margin-bottom:6px}.chk::before{content:"✓";color:#00E5FF;font-weight:900}.stat{display:grid;grid-template-columns:repeat(3,1fr);background:#0F1218;border:1px solid #1F242E;border-radius:14px;padding:12px;text-align:center;margin-bottom:10px}.stat b{font-family:monospace;font-size:14px;display:block;margin-top:4px}.stat span{font-size:8px;color:#64748b;font-weight:900;letter-spacing:.1em}.item{background:#0F1218;border:1px solid #1F242E;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px;cursor:pointer;font-size:12px}.item.s{border-color:#00E5FF;background:#00E5FF14}.row{display:flex;gap:10px;margin-top:10px}.warn{background:#FF910010;border:1px solid #FF910033;border-radius:12px;padding:12px;font-size:10px;color:#FF9100;margin-bottom:12px;line-height:1.5}.dngr{background:#FF3B3B10;border:1px solid #FF3B3B33;border-radius:12px;padding:12px;font-size:10px;color:#FF3B3B;margin-bottom:12px;line-height:1.5}.c{width:80px;height:80px;border-radius:50%;background:#00E5FF33;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:40px;filter:drop-shadow(0 0 20px #00E5FF99)}.ico{width:40px;height:40px;border-radius:10px;background:#161A22;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.bk{width:34px;height:34px;border-radius:50%;background:#161A22;border:1px solid #1F242E;color:#94a3b8;font-size:15px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;justify-content:center}.key{background:#0F1218;border:1px solid #1F242E;color:#fff;font-family:monospace;font-weight:700;font-size:20px;padding:14px;border-radius:10px;cursor:pointer;text-align:center}.key:active{background:#161A22}.circ{position:relative;width:80px;height:80px;margin:0 auto}.circ svg{transform:rotate(-90deg)}.circ .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;font-weight:900}.tg{width:42px;height:24px;border-radius:12px;background:#1F242E;position:relative;transition:.2s;flex-shrink:0}.tg::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#6B7280;transition:.2s}.tg.on{background:#00E5FF33}.tg.on::after{left:20px;background:#00E5FF}.tag{font-size:8px;font-weight:900;padding:2px 6px;border-radius:4px;background:#FF910033;color:#FF9100}.tag.g{background:#10b98133;color:#10b981}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);let st=JSON.parse(localStorage.getItem('pai2')||'null')||{pin:null,email:null,trash:[],prot:0,gb:0,done:false,step:'welcome'};const sv=()=>localStorage.setItem('pai2',JSON.stringify(st));const fmt=b=>{const k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(b)/Math.log(k));return(b/Math.pow(k,i)).toFixed(1)+' '+s[i]};const ico=t=>t==='image'?'📷':t==='pdf'?'📄':t==='doc'?'📝':t==='video'?'🎬':'📁';const F=[{id:1,n:'IMG_2847.jpg',s:2450000,t:'image',g:'43.85°N',d:'iPhone 15 Pro'},{id:2,n:'IMG_2848.jpg',s:3120000,t:'image',g:'43.32°N',d:'iPhone 15 Pro'},{id:3,n:'screenshot_001.png',s:890000,t:'image'},{id:4,n:'ugovor.pdf',s:456000,t:'pdf',a:'Amina K.',c:'PurgeAI d.o.o.'},{id:5,n:'IMG_2850.jpg',s:2870000,t:'image',g:'17.82°N',d:'iPhone 15 Pro'},{id:6,n:'napomene.docx',s:89000,t:'doc',a:'Amina K.'},{id:7,n:'IMG_2851.jpg',s:2650000,t:'image'},{id:8,n:'video_001.mp4',s:45600000,t:'video',g:'43.85°N'},{id:9,n:'budget.xlsx',s:234000,t:'doc',a:'Amina K.'},{id:10,n:'IMG_2852.jpg',s:2980000,t:'image',g:'43.32°N'}];let cur=st.step||'welcome',sel=new Set(),pend=[],pb='',ps='create',pc=null;
function go(n){if(n===cur)return;cur=n;st.step=n;if(n!=='pin')sv();r()}function back(n){go(n||'home')}
function r(){const S={
welcome:`<h1>🛡️ PurgeAI</h1><p class="cy" style="font-weight:900;letter-spacing:.15em;font-size:9px">100% OFFLINE · TRUST 100%</p><h2 style="margin-top:16px">Maksimalna<br>privatnost za tvoje fajlove</h2><p>PurgeAI nikad ne pristupa internetu. Nema servera. Nema cloud-a. Nema tracking-a. Sve ostaje u tvom telefonu.</p><div class="card p"><div class="chk">Bez interneta, bez servera</div><div class="chk">Bez cloud backup-a</div><div class="chk">Bez reklama i pretplate</div><div class="chk">Secure delete (DoD 3-pass)</div><div class="chk">PIN enkripcija (SHA-256)</div></div><button class="btn" onclick="go('email')">Započni demo →</button>`,
email:`<button class="bk" onclick="back('welcome')">←</button><h2>Tvoj lokalni identitet</h2><p>Email se koristi <b class="cy">samo za identifikaciju</b> na ovom uređaju. Nikad se ne šalje internetom. Original se ne čuva nigdje.</p><input id="em" type="email" value="demo@purgeai.app" style="width:100%;background:#0F1218;border:1px solid #1F242E;border-radius:12px;padding:14px;color:#fff;font-family:monospace;font-size:13px;margin-bottom:12px;outline:0"><div class="warn"><b>🔒 Privacy by design:</b> Email se hashuje (SHA-256) i čuva samo na tvom telefonu. Original se briše odmah.</div><button class="btn" onclick="setEm()">Nastavi</button>`,
pin:`<button class="bk" onclick="back('email')">←</button><h2>${ps==='create'?'Postavi PIN':'Potvrdi PIN'}</h2><p>${ps==='create'?'Zaštiti aplikaciju 4-cifrenim PIN-om':'Unesi isti PIN ponovo radi potvrde'}</p><div class="warn" style="text-align:center">💡 <b>Demo:</b> unesi <b>1234</b> i potvrdi isti</div><div style="display:flex;gap:12px;justify-content:center;margin:24px 0">${[0,1,2,3].map(i=>`<div style="width:16px;height:16px;border-radius:50%;background:${i<pb.length?'#00E5FF':'#1F242E'};box-shadow:${i<pb.length?'0 0 12px #00E5FF99':'none'}"></div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin:0 auto">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<div></div>':`<button class="key" onclick="ph('${k}')">${k==='⌫'?'←':k}</button>`).join('')}</div><button class="btn btn2" style="margin-top:16px" onclick="skipPin()">Preskoči (demo)</button>`,
warning:`<h2>⚠️ Pročitaj pažljivo</h2><p>PurgeAI <b class="rd">nema recovery opciju</b>. Ako zaboraviš PIN, tvoji podaci su trajno izgubljeni.</p><div class="dngr"><b>Ne postoji:</b><br>✕ Resetovanje PIN-a<br>✕ Vraćanje podataka<br>✕ Cloud backup<br>✕ Support recovery<br>✕ Skriveni backdoor</div><div class="card p" style="font-size:11px;color:#00E5FF;line-height:1.6"><b>Zašto?</b> Ovo je cijena maksimalne sigurnosti. Niko — pa ni mi sami — ne može pristupiti tvojim podacima. To je prava privatnost.</div><button class="btn" onclick="go('home')">Razumijem, nastavi →</button>`,
home:st.prot>0||st.trash.length>0?`<h1>🛡️ PurgeAI</h1><p class="cy" style="font-weight:900;letter-spacing:.15em;font-size:9px">TRUST 100% · OFFLINE</p><div class="card p" style="display:flex;align-items:center;gap:14px;margin-top:14px"><div class="circ"><svg viewBox="0 0 100 100" width="80" height="80"><circle cx="50" cy="50" r="42" stroke="#1F242E" stroke-width="7" fill="none"/><circle cx="50" cy="50" r="42" stroke="#00E5FF" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="${263.9-(263.9*Math.min(100,st.prot*10)/100)}"/></svg><div class="lbl"><div style="font-size:16px">${Math.min(100,st.prot*10)}<span style="font-size:9px">%</span></div><div style="font-size:7px;color:#64748b;letter-spacing:.1em">ZAŠTIĆENO</div></div></div><div style="flex:1"><div style="font-size:13px;font-weight:800">Privacy Score</div><div style="font-size:10px;color:#64748b;margin-top:4px">Zaštitio si ${st.prot} fajlova</div></div></div><div class="stat"><div><span>ZAŠTIĆENO</span><b class="cy">${st.prot}</b></div><div style="border-left:1px solid #1F242E;border-right:1px solid #1F242E"><span>U SMEĆU</span><b class="am">${st.trash.length}</b></div><div><span>GB</span><b>${st.gb.toFixed(2)}</b></div></div><div class="card p"><div class="chk">Nema internet dozvole</div><div class="chk">Sve ostaje u telefonu</div><div class="chk">Bez reklama, bez pretplate</div><div class="chk">Secure delete (DoD)</div></div>${st.trash.length?`<div class="warn" onclick="go('trash')" style="cursor:pointer"><b>🗑️ Smeće:</b> ${st.trash.length} fajlova · ${fmt(st.trash.reduce((a,t)=>a+t.s,0))}<div style="font-size:9px;color:#94a3b8;margin-top:4px">Klikni za pregled →</div></div>`:''}<div class="row"><button class="btn btn2" onclick="go('trash')">🗑️ Smeće</button><button class="btn" onclick="go('pick')">➕ Odaberi</button></div><div class="row"><button class="btn btn2" onclick="go('settings')">⚙ Postavke</button><button class="btn btn2" onclick="go('welcome')">ℹ O aplikaciji</button></div>`:`<h1>🛡️ PurgeAI</h1><p class="cy" style="font-weight:900;letter-spacing:.15em;font-size:9px">TRUST 100% · OFFLINE</p><h2 style="margin-top:20px">Zaštiti svoje fajlove</h2><p>Odaberi slike, PDF-ove, Word ili Excel dokumente — PurgeAI će ih očistiti od skrivenih metapodataka.</p><div class="card p"><div class="chk">Nema internet dozvole</div><div class="chk">Sve ostaje u telefonu</div><div class="chk">Bez reklama, bez pretplate</div><div class="chk">Secure delete (DoD)</div></div><button class="btn" onclick="go('pick')">➕ Odaberi fajlove</button><div class="row"><button class="btn btn2" onclick="go('settings')">⚙ Postavke</button><button class="btn btn2" onclick="go('welcome')">ℹ O aplikaciji</button></div>`,
pick:`<button class="bk" onclick="back('home')">←</button><h2>Odaberi fajlove</h2><div class="cy" style="font-size:10px;margin-bottom:10px;font-weight:700">DEMO · ${sel.size} odabrano</div>${F.map(f=>`<div class="item ${sel.has(f.id)?'s':''}" onclick="tg(${f.id})"><div class="ico">${ico(f.t)}</div><div style="flex:1;min-width:0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.n}</div><div class="mu" style="font-size:9px;margin-top:2px">${fmt(f.s)} ${f.g?'<span class="am">· EXIF GPS</span>':f.a?'<span class="am">· Autor</span>':''}</div></div><div style="width:22px;height:22px;border-radius:6px;background:${sel.has(f.id)?'#00E5FF':'transparent'};border:${sel.has(f.id)?'0':'2px solid #1F242E'};color:#0A0B0F;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px">${sel.has(f.id)?'✓':''}</div></div>`).join('')}<div class="row"><button class="btn btn2" onclick="selAll()">Sve</button><button class="btn" onclick="proc()">Zaštiti (${sel.size})</button></div>`,
res:`<button class="bk" onclick="back('pick')">←</button><h2>Pronađeni metapodaci</h2><div class="warn"><b>⚠️ ${pend.length} fajlova</b> sadrže osjetljive podatke<div style="font-size:9px;color:#94a3b8;margin-top:4px">GPS lokacije, model uređaja, autor, vrijeme</div></div>${pend.map(f=>`<div class="item"><div class="ico">${ico(f.t)}</div><div style="flex:1;min-width:0"><div style="font-weight:700">${f.n}</div><div class="am" style="font-size:9px;margin-top:2px">${[f.g,f.d,f.a,f.c].filter(Boolean).join(' · ')||'Metadata otkrivena'}</div></div></div>`).join('')}<div class="row"><button class="btn btn2" onclick="toTrash()">🗑️ U Smeće</button><button class="btn btn3" onclick="perm()">⚠️ Trajno</button></div>`,
trash:st.trash.length?`<button class="bk" onclick="back('home')">←</button><h2>🗑️ Smeće</h2><div class="warn"><b>⏰ Automatsko brisanje</b><div style="font-size:9px;margin-top:4px">Nakon 30 dana fajlovi se trajno brišu</div><div style="height:4px;background:#161A22;border-radius:4px;margin-top:8px;overflow:hidden"><div style="height:100%;width:${Math.min(100,((30-Math.ceil((new Date(st.trash[0].exp)-Date.now())/864e5))/30)*100)}%;background:linear-gradient(90deg,#FF9100,#FF3B3B)"></div></div></div>${st.trash.map(t=>`<div class="item"><div class="ico">${ico(t.t)}</div><div style="flex:1"><div style="font-weight:700">${t.n}</div><div class="mu" style="font-size:9px">${fmt(t.s)}</div></div><div style="text-align:right"><div class="am" style="font-family:monospace;font-weight:900;font-size:12px">${Math.max(0,Math.ceil((new Date(t.exp)-Date.now())/864e5))}d</div><div class="mu" style="font-size:7px;letter-spacing:.1em">PREOSTALO</div></div></div>`).join('')}<div class="row"><button class="btn btn2" onclick="restore()">↺ Vrati sve</button><button class="btn btn3" onclick="empty()">🗑️ Isprazni</button></div>`:`<button class="bk" onclick="back('home')">←</button><h2>🗑️ Smeće</h2><div style="text-align:center;padding:40px 0;color:#64748b"><div style="font-size:48px;margin-bottom:12px">📭</div><div style="font-size:12px">Smeće je prazno</div></div><button class="btn btn2" onclick="back('home')">← Nazad</button>`,
ok:`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div class="c">✓</div><h2 id="t1" style="font-size:20px">Uspješno!</h2><p id="t2" style="margin-top:8px">Sigurnosno obrađeno.</p><div class="stat" style="width:100%;margin-top:20px"><div><span>UKUPNO</span><b class="cy" id="t3">0</b></div><div style="border-left:1px solid #1F242E"><span>VELIČINA</span><b class="am" id="t4">0</b></div><div></div></div></div><button class="btn" onclick="go('home')">Gotovo</button>`,
settings:`<button class="bk" onclick="back('home')">←</button><h2>⚙ Postavke</h2><div class="card"><div style="display:flex;align-items:center;gap:12px"><div class="ico">🛡️</div><div><div style="font-weight:700;font-size:12px">Lokalni profil</div><div class="mu" style="font-size:9px;font-family:monospace;margin-top:2px">${st.email||'nije postavljeno'}</div></div></div></div><h3 class="mu" style="letter-spacing:.15em;font-size:9px;margin:14px 0 8px">SIGURNOST</h3><div class="card"><div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-weight:700;font-size:12px">PIN zaključavanje</div><div class="mu" style="font-size:9px;margin-top:2px">${st.pin?'Aktivno':'Isključeno'}</div></div><div class="tg ${st.pin?'on':''}" onclick="tgPin()"></div></div></div><h3 class="mu" style="letter-spacing:.15em;font-size:9px;margin:14px 0 8px">PRIVATNOST</h3><div class="card p"><div class="chk">Nema internet dozvole</div><div class="chk">Nema cloud backup-a</div><div class="chk">Nema tracking-a</div><div class="chk">Nema reklama</div><div class="chk">Nema pretplate</div></div><h3 class="mu" style="letter-spacing:.15em;font-size:9px;margin:14px 0 8px">UPOZORENJE</h3><div class="dngr"><b>⚠️ Nema recovery-a</b><br>Ako zaboraviš PIN, svi podaci su trajno izgubljeni. Ne postoji backup nigdje.</div><button class="btn btn3" onclick="reset()">Resetuj demo</button><p style="text-align:center;font-size:8px;color:#475569;font-weight:900;letter-spacing:.1em;margin-top:14px">PURGEAI v2.0 · 100% OFFLINE</p>`};
$('#app').innerHTML=`<div style="flex:1;display:flex;flex-direction:column">${S[cur]||S.welcome}</div>`}
function setEm(){const v=$('#em').value.trim();if(!v.includes('@'))return alert('Unesi validan email');st.email=v;sv();go('pin')}
function ph(k){if(k==='⌫')pb=pb.slice(0,-1);else{if(pb.length>=4)return;pb+=k}const d=document.querySelectorAll('#app div[style*="border-radius:50%"]');d.forEach((e,i)=>e.style.background=i<pb.length?'#00E5FF':'#1F242E');if(pb.length===4)setTimeout(()=>{if(ps==='create'){pc=pb;pb='';ps='confirm';r()}else if(pb===pc){st.pin=pb;st.done=true;sv();pb='';ps='create';go('warning')}else{pb='';ps='create';alert('PIN se ne poklapa');r()}},180)}
function skipPin(){st.done=true;sv();go('home')}
function tg(id){sel.has(id)?sel.delete(id):sel.add(id);r()}
function selAll(){sel.size===F.length?sel.clear():F.forEach(f=>sel.add(f.id));r()}
function proc(){pend=F.filter(f=>sel.has(f.id));if(!pend.length)return alert('Odaberi bar jedan fajl');go('res')}
function toTrash(){const now=Date.now();pend.forEach(f=>st.trash.push({id:now+Math.random(),n:f.n,s:f.s,t:f.t,exp:new Date(now+30*864e5).toISOString()}));st.prot+=pend.length;sv();showOk(pend.length+' fajlova u Smeću','Sačuvano 30 dana.',pend.length,pend.reduce((a,f)=>a+f.s,0))}
function perm(){if(!confirm('⚠️ TRAJNO obrisati '+pend.length+' fajlova?\n\nNema povratka!'))return;if(st.pin&&prompt('Unesi PIN:')!==st.pin)return alert('Pogrešan PIN');st.prot+=pend.length;st.gb+=pend.reduce((a,f)=>a+f.s,0)/(1024**3);sv();showOk('Trajno obrisano','Nepovratno uklonjeno.',pend.length,pend.reduce((a,f)=>a+f.s,0))}
function restore(){if(!st.trash.length)return;if(!confirm('Vratiti '+st.trash.length+' fajlova?'))return;const n=st.trash.length;st.trash=[];sv();showOk('Vraćeno','Fajlovi su vraćeni.',n,0)}
function empty(){if(!st.trash.length)return;if(!confirm('⚠️ TRAJNO obrisati sav sadržaj smeća?\n\nNema povratka!'))return;if(st.pin&&prompt('Unesi PIN:')!==st.pin)return alert('Pogrešan PIN');const n=st.trash.length,s=st.trash.reduce((a,t)=>a+t.s,0);st.trash=[];st.gb+=s/(1024**3);sv();showOk('Ispražnjeno','Smeće je prazno.',n,s)}
function tgPin(){st.pin=st.pin?null:prompt('Postavi novi PIN (4 cifre):')||'1234';sv();r()}
function reset(){if(!confirm('Resetovati demo?\n\nSvi podaci će biti obrisani.'))return;localStorage.removeItem('pai2');location.reload()}
function showOk(m,s,c,sz){go('ok');setTimeout(()=>{$('#t1').textContent=m;$('#t2').textContent=s;$('#t3').textContent=c;$('#t4').textContent=fmt(sz)},50)}
r();
</script></body></html>
