<!D<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PurgeAI</title><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#020306;color:#fff;display:flex;justify-content:center;min-height:100vh}#app{width:100%;max-width:390px;padding:18px;background:#0A0B0F;display:flex;flex-direction:column;min-height:100vh}h1{font-size:20px;font-weight:900;margin-bottom:4px}h2{font-size:17px;font-weight:900;margin-bottom:10px}h3{font-size:10px;color:#64748b;letter-spacing:.15em;margin:12px 0 6px}p{font-size:12px;color:#94a3b8;line-height:1.6;margin-bottom:10px}.cy{color:#00E5FF}.am{color:#FF9100}.rd{color:#FF3B3B}.mu{color:#64748b}.b{width:100%;background:linear-gradient(90deg,#00E5FF,#0082FF);color:#0A0B0F;border:0;padding:13px;border-radius:12px;font-weight:900;font-size:11px;text-transform:uppercase;cursor:pointer;margin-top:8px}.b2{background:#161A22;color:#cbd5e1;border:1px solid #1F242E}.b3{background:#3B1414;color:#fca5a5;border:1px solid #FF3B3B55}.c{background:#0F1218;border:1px solid #1F242E;border-radius:14px;padding:13px;margin-bottom:10px}.cp{border-color:#00E5FF55;background:#00E5FF0D}.k{display:flex;gap:8px;font-size:11px;color:#cbd5e1;margin-bottom:5px}.k::before{content:"✓";color:#00E5FF;font-weight:900}.s{display:grid;grid-template-columns:repeat(3,1fr);background:#0F1218;border:1px solid #1F242E;border-radius:14px;padding:12px;text-align:center;margin-bottom:10px}.s b{font-family:monospace;font-size:14px;display:block;margin-top:3px}.s span{font-size:8px;color:#64748b;font-weight:900}.i{background:#0F1218;border:1px solid #1F242E;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:6px;cursor:pointer;font-size:12px}.is{border-color:#00E5FF;background:#00E5FF14}.r{display:flex;gap:8px}.w{background:#FF910010;border:1px solid #FF910033;border-radius:12px;padding:11px;font-size:10px;color:#FF9100;margin-bottom:10px}.d{background:#FF3B3B10;border:1px solid #FF3B3B33;border-radius:12px;padding:11px;font-size:10px;color:#FF3B3B;margin-bottom:10px}.ic{width:38px;height:38px;border-radius:10px;background:#161A22;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}.bk{width:32px;height:32px;border-radius:50%;background:#161A22;border:1px solid #1F242E;color:#94a3b8;cursor:pointer;margin-bottom:12px}.ky{background:#0F1218;border:1px solid #1F242E;color:#fff;font-family:monospace;font-weight:700;font-size:19px;padding:13px;border-radius:10px;cursor:pointer}.tip{background:#00E5FF10;border:1px solid #00E5FF33;border-radius:14px;padding:12px;margin-bottom:10px;font-size:11px;color:#cbd5e1}.h{display:flex;gap:10px;padding:9px;background:#0F1218;border-radius:10px;margin-bottom:6px;font-size:11px;border-left:3px solid #00E5FF}.ht{border-left-color:#FF9100}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);
let st=JSON.parse(localStorage.getItem('p')||'null')||{pin:null,email:null,trash:[],prot:0,gb:0,done:false,step:'welcome',hist:[],xp:0,cleaned:0,tipIdx:0};
const sv=()=>localStorage.setItem('p',JSON.stringify(st));
const fmt=b=>{const k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(b)/Math.log(k));return(b/Math.pow(k,i)).toFixed(1)+s[i]};
const ico=t=>t==='image'?'📷':t==='pdf'?'📄':t==='doc'?'📝':'🎬';
const F=[{id:1,n:'IMG_2847.jpg',s:2450000,t:'image',g:'43.85°N'},{id:2,n:'IMG_2848.jpg',s:3120000,t:'image',g:'43.32°N'},{id:3,n:'screenshot.png',s:890000,t:'image'},{id:4,n:'ugovor.pdf',s:456000,t:'pdf',a:'Amina K.'},{id:5,n:'IMG_2850.jpg',s:2870000,t:'image',g:'17.82°N'},{id:6,n:'napomene.docx',s:89000,t:'doc',a:'Amina K.'}];
const TIPS=['WhatsApp briše EXIF, ali email NE. Slika poslana emailom otkriva lokaciju.','80% ljudi ne zna šta je EXIF metadata.','Svaka 4. slika na tvom telefonu sadrži GPS lokaciju.','Screenshotovi čuvaju metapodatke.'];
let cur=st.step||'welcome',sel=new Set(),pend=[],pb='',ps='create',pc=null;
function log(t,m,i){st.hist.unshift({t:Date.now(),type:t,msg:m,icon:i});if(st.hist.length>20)st.hist.pop();sv()}
function go(n){if(n===cur)return;cur=n;st.step=n;sv();r()}
function r(){const S={
welcome:`<h1>🛡️ PurgeAI</h1><p class="cy" style="font-weight:900;letter-spacing:.15em;font-size:9px">100% OFFLINE</p><h2 style="margin-top:14px">Maksimalna privatnost</h2><p>Nikad ne pristupa internetu. Nema servera. Nema tracking-a.</p><div class="c cp"><div class="k">Bez interneta</div><div class="k">Bez cloud backup-a</div><div class="k">Bez reklama</div><div class="k">Secure delete</div></div><button class="b" onclick="go('email')">Započni →</button>`,
email:`<button class="bk" onclick="go('welcome')">←</button><h2>Lokalni identitet</h2><p>Email se koristi <b class="cy">samo lokalno</b>. Nikad se ne šalje.</p><input id="em" value="demo@purgeai.app" style="width:100%;background:#0F1218;border:1px solid #1F242E;border-radius:12px;padding:13px;color:#fff;font-family:monospace;margin-bottom:10px;outline:0"><div class="w">🔒 Email se hashuje SHA-256, čuva lokalno.</div><button class="b" onclick="setEm()">Nastavi</button>`,
pin:`<button class="bk" onclick="go('email')">←</button><h2>${ps==='create'?'Postavi PIN':'Potvrdi PIN'}</h2><p>${ps==='create'?'4-cifreni PIN':'Ponovi PIN'}</p><div class="w" style="text-align:center">💡 Demo: <b>1234</b></div><div style="display:flex;gap:12px;justify-content:center;margin:18px 0">${[0,1,2,3].map(i=>`<div style="width:16px;height:16px;border-radius:50%;background:${i<pb.length?'#00E5FF':'#1F242E'}"></div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:230px;margin:0 auto">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<div></div>':`<button class="ky" onclick="ph('${k}')">${k==='⌫'?'←':k}</button>`).join('')}</div><button class="b b2" style="margin-top:12px" onclick="skipPin()">Preskoči</button>`,
warning:`<h2>⚠️ Pročitaj</h2><p>PurgeAI <b class="rd">nema recovery</b>. Ako zaboraviš PIN, sve je izgubljeno.</p><div class="d"><b>Ne postoji:</b><br>✕ Reset PIN-a<br>✕ Vraćanje podataka<br>✕ Cloud backup<br>✕ Recovery</div><div class="c cp" style="font-size:11px;color:#00E5FF">Cijena maksimalne sigurnosti. Niko ne može pristupiti podacima.</div><button class="b" onclick="go('home')">Razumijem →</button>`,
home:`<h1>🛡️ PurgeAI</h1><p class="cy" style="font-weight:900;letter-spacing:.15em;font-size:9px">TRUST 100% · LEVEL ${Math.floor(st.xp/50)+1}</p><div class="s" style="margin-top:12px"><div><span>ZAŠTIĆENO</span><b class="cy">${st.prot}</b></div><div style="border-left:1px solid #1F242E;border-right:1px solid #1F242E"><span>U SMEĆU</span><b class="am">${st.trash.length}</b></div><div><span>XP</span><b>${st.xp}</b></div></div><div class="tip">💡 <b class="cy">Da li ste znali?</b><br>${TIPS[st.tipIdx%TIPS.length]}<div style="margin-top:6px;text-align:right"><span onclick="st.tipIdx++;sv();r()" style="color:#00E5FF;font-weight:700;cursor:pointer">Sljedeći →</span></div></div>${st.trash.length?`<div class="w" onclick="go('trash')" style="cursor:pointer">🗑️ <b>Smeće:</b> ${st.trash.length} fajlova</div>`:''}<button class="b" onclick="go('pick')">➕ Odaberi fajlove</button><div class="r"><button class="b b2" onclick="go('trash')">🗑️ Smeće</button><button class="b b2" onclick="go('hist')">📅 Istorija</button></div><div class="r"><button class="b b2" onclick="go('stats')">📊 Statistika</button><button class="b b2" onclick="go('settings')">⚙ Postavke</button></div>`,
pick:`<button class="bk" onclick="go('home')">←</button><h2>Odaberi fajlove</h2><div class="cy" style="font-size:10px;margin-bottom:10px">${sel.size} odabrano</div>${F.map(f=>`<div class="i ${sel.has(f.id)?'is':''}" onclick="tg(${f.id})"><div class="ic">${ico(f.t)}</div><div style="flex:1"><div style="font-weight:700">${f.n}</div><div class="mu" style="font-size:9px">${fmt(f.s)} ${f.g?'<span class="am">· EXIF</span>':f.a?'<span class="am">· '+f.a+'</span>':''}</div></div><div style="width:22px;height:22px;border-radius:6px;background:${sel.has(f.id)?'#00E5FF':'transparent'};border:${sel.has(f.id)?'0':'2px solid #1F242E'};color:#0A0B0F;display:flex;align-items:center;justify-content:center;font-weight:900">${sel.has(f.id)?'✓':''}</div></div>`).join('')}<div class="r"><button class="b b2" onclick="selAll()">Sve</button><button class="b" onclick="proc()">Zaštiti (${sel.size})</button></div>`,
res:`<button class="bk" onclick="go('pick')">←</button><h2>Metapodaci</h2><div class="w"><b>⚠️ ${pend.length} fajlova</b> sadrže osjetljive podatke</div>${pend.map(f=>`<div class="i"><div class="ic">${ico(f.t)}</div><div style="flex:1"><div style="font-weight:700">${f.n}</div><div class="am" style="font-size:9px">${f.g||f.a||'Metadata'}</div></div></div>`).join('')}<div class="r"><button class="b b2" onclick="toTrash()">🗑️ U Smeće</button><button class="b b3" onclick="perm()">⚠️ Trajno</button></div>`,
trash:st.trash.length?`<button class="bk" onclick="go('home')">←</button><h2>🗑️ Smeće</h2><div class="w">⏰ Automatsko brisanje za 30 dana</div>${st.trash.map(t=>`<div class="i"><div class="ic">${ico(t.t)}</div><div style="flex:1"><div style="font-weight:700">${t.n}</div><div class="mu" style="font-size:9px">${fmt(t.s)}</div></div><b class="am" style="font-family:monospace">${Math.max(0,Math.ceil((new Date(t.exp)-Date.now())/864e5))}d</b></div>`).join('')}<div class="r"><button class="b b2" onclick="restore()">↺ Vrati</button><button class="b b3" onclick="empty()">🗑️ Isprazni</button></div>`:`<button class="bk" onclick="go('home')">←</button><h2>🗑️ Smeće</h2><div style="text-align:center;padding:40px 0;color:#64748b">📭<br>Smeće je prazno</div><button class="b b2" onclick="go('home')">Nazad</button>`,
hist:`<button class="bk" onclick="go('home')">←</button><h2>📅 Istorija</h2>${st.hist.length?st.hist.map(h=>`<div class="h ${h.type==='trash'?'ht':''}"><span>${h.icon}</span><div style="flex:1"><div style="font-weight:700">${h.msg}</div><div class="mu" style="font-size:9px">${new Date(h.t).toLocaleString('bs-BA',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join(''):`<div style="text-align:center;padding:40px 0;color:#64748b">Nema aktivnosti</div>`}<button class="b b2" onclick="if(confirm('Obrisati?')){st.hist=[];sv();r()}">Obriši istoriju</button>`,
stats:`<button class="bk" onclick="go('home')">←</button><h2>📊 Statistika</h2><div class="s"><div><span>ZAŠTIĆENO</span><b class="cy">${st.prot}</b></div><div style="border-left:1px solid #1F242E;border-right:1px solid #1F242E"><span>OBRISANO</span><b class="am">${st.cleaned}</b></div><div><span>GB</span><b>${st.gb.toFixed(2)}</b></div></div><h3>ZADNJIH 30 DANA</h3><div class="c"><svg viewBox="0 0 300 80" style="width:100%;height:80px"><defs><linearGradient id="g"><stop offset="0%" stop-color="#00E5FF" stop-opacity=".3"/><stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/></linearGradient></defs><path d="M0 60 Q30 30 60 45 T120 25 T180 40 T240 20 T300 35 L300 80 L0 80 Z" fill="url(#g)"/><path d="M0 60 Q30 30 60 45 T120 25 T180 40 T240 20 T300 35" fill="none" stroke="#00E5FF" stroke-width="2"/></svg></div>`,
settings:`<button class="bk" onclick="go('home')">←</button><h2>⚙ Postavke</h2><div class="c"><b>${st.email||'Lokalni profil'}</b></div><h3>SIGURNOST</h3><div class="c"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:12px">PIN zaključavanje</b><div class="mu" style="font-size:9px">${st.pin?'Aktivno':'Isključeno'}</div></div><button class="b b2" style="width:auto;margin:0;padding:6px 10px;font-size:10px" onclick="st.pin=st.pin?null:prompt('PIN:')||'1234';sv();r()">${st.pin?'Isključi':'Uključi'}</button></div></div><h3>PRIVATNOST</h3><div class="c cp"><div class="k">Nema internet dozvole</div><div class="k">Nema cloud backup-a</div><div class="k">Nema tracking-a</div></div><h3>UPOZORENJE</h3><div class="d"><b>⚠️ Nema recovery-a</b><br>Ako zaboraviš PIN, podaci su izgubljeni.</div><button class="b b3" onclick="if(confirm('Resetovati demo?')){localStorage.removeItem('p');location.reload()}">Resetuj demo</button>`,
ok:`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-size:80px;margin-bottom:20px">✓</div><h2 id="t1">Uspješno!</h2><p id="t2">Obrađeno.</p><div class="s" style="width:100%;margin-top:16px"><div><span>UKUPNO</span><b class="cy" id="t3">0</b></div><div style="border-left:1px solid #1F242E"><span>VELIČINA</span><b class="am" id="t4">0</b></div></div></div><button class="b" onclick="go('home')">Gotovo</button>`};
$('#app').innerHTML=`<div style="flex:1;display:flex;flex-direction:column">${S[cur]||S.welcome}</div>`}
function setEm(){const v=$('#em').value.trim();if(!v.includes('@'))return alert('Email?');st.email=v;sv();go('pin')}
function ph(k){if(k==='⌫')pb=pb.slice(0,-1);else{if(pb.length>=4)return;pb+=k}const d=document.querySelectorAll('#app div[style*="border-radius:50%"]');d.forEach((e,i)=>e.style.background=i<pb.length?'#00E5FF':'#1F242E');if(pb.length===4)setTimeout(()=>{if(ps==='create'){pc=pb;pb='';ps='confirm';r()}else if(pb===pc){st.pin=pb;st.done=true;sv();pb='';ps='create';go('warning')}else{pb='';ps='create';alert('PIN se ne poklapa');r()}},180)}
function skipPin(){st.done=true;sv();go('home')}
function tg(id){sel.has(id)?sel.delete(id):sel.add(id);r()}
function selAll(){sel.size===F.length?sel.clear():F.forEach(f=>sel.add(f.id));r()}
function proc(){pend=F.filter(f=>sel.has(f.id));if(!pend.length)return alert('Odaberi fajlove');go('res')}
function toTrash(){const now=Date.now();pend.forEach(f=>st.trash.push({id:now+Math.random(),n:f.n,s:f.s,t:f.t,exp:new Date(now+30*864e5).toISOString()}));st.prot+=pend.length;log('','Zaštićeno '+pend.length,'✅');sv();showOk(pend.length+' u Smeću','Sačuvano 30 dana.',pend.length,pend.reduce((a,f)=>a+f.s,0))}
function perm(){if(!confirm('⚠️ TRAJNO obrisati '+pend.length+'?\n\nNema povratka!'))return;if(st.pin&&prompt('PIN:')!==st.pin)return alert('Pogrešan PIN');st.prot+=pend.length;st.gb+=pend.reduce((a,f)=>a+f.s,0)/(1024**3);log('','Trajno obrisano '+pend.length,'✅');sv();showOk('Trajno obrisano','Nepovratno.',pend.length,pend.reduce((a,f)=>a+f.s,0))}
function restore(){if(!st.trash.length)return;if(!confirm('Vratiti?'))return;const n=st.trash.length;st.trash=[];log('trash','Vraćeno '+n,'↺');sv();showOk('Vraćeno','Fajlovi su vraćeni.',n,0)}
function empty(){if(!st.trash.length)return;if(!confirm('⚠️ TRAJNO obrisati smeće?'))return;if(st.pin&&prompt('PIN:')!==st.pin)return alert('Pogrešan PIN');const n=st.trash.length,s=st.trash.reduce((a,t)=>a+t.s,0);st.trash=[];st.gb+=s/(1024**3);st.cleaned+=n;log('trash','Ispražnjeno '+n,'🧹');sv();showOk('Ispražnjeno','Smeće je prazno.',n,s)}
function showOk(m,s,c,sz){go('ok');setTimeout(()=>{$('#t1').textContent=m;$('#t2').textContent=s;$('#t3').textContent=c;$('#t4').textContent=fmt(sz)},50)}
r();
</script></body></html>
