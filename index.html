<style>

  .num-key { display:flex; align-items:center; justify-content:center; height:60px; border-radius:14px;

    font-weight:700; font-size:22px; color:#fff; cursor:pointer; transition: all .15s; }

  .toggle { width:42px; height:24px; border-radius:12px; background:#1F242E; cursor:pointer; position:relative; transition: all .25s; }
  .toggle::after { content:''; position:absolute; top:2px; left:2px; width:20px; height:20px;

  .toggle.on { background: rgba(0,229,255,.2); box-shadow: 0 0 12px rgba(0,229,255,.3); }
  .toggle.on::after { transform:translateX(18px); background:#00E5FF; }
  .fade-in { animation: fadeIn .4s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
