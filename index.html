<!DOCTYPE html><html lang="bs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PurgeAI</title><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0A0B0F;color:#fff;font-family:system-ui;display:flex;justify-content:center;min-height:100vh}#app{width:100%;max-width:390px;padding:20px;background:#0A0B0F;display:flex;flex-direction:column;min-height:100vh}h1{font-size:24px;font-weight:900;margin-bottom:8px}h2{font-size:18px;font-weight:900;margin-bottom:12px}p{font-size:12px;color:#94a3b8;line-height:1.6;margin-bottom:14px}.cy{color:#00E5FF}.am{color:#FF9100}.rd{color:#FF3B3B}.mu{color:#64748b}.btn{width:100%;background:linear-gradient(90deg,#00E5FF,#0082FF);color:#0A0B0F;border:0;padding:14px;border-radius:12px;font-weight:900;font-size:12px;text-transform:uppercase;cursor:pointer;margin-top:auto}.btn2{background:#161A22;color:#cbd5e1;border:1px solid #1F242E}.btn3{background:#3B1414;color:#fca5a5;border:1px solid #FF3B3B55}.card{background:#0F1218;border:1px solid #1F242E;border-radius:14px;padding:14px;margin-bottom:10px}.card.p{border-color:#00E5FF55;background:#00E5FF0D}.chk{display:flex;gap:8px;font-size:11px;color:#cbd5e1;margin-bottom:6px}.chk::before{content:"✓";color:#00E5FF;font-weight:900}.stat{display:grid;grid-template-columns:repeat(3,1fr);background:#0F1218;border:1px solid #1F242E;border-radius:14px;padding:12px;text-align:center;margin-bottom:10px}.stat b{font-family:monospace;font-size:14px;display:block;margin-top:4px}.stat span{font-size:8px;color:#64748b;font-weight:900}.item{background:#0F1218;border:1px solid #1F242E;border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px;cursor:pointer;font-size:12px}.item.s{border-color:#00E5FF;background:#00E5FF14}.row{display:flex;gap:10px;margin-top:10px}.warn{background:#FF910010;border:1px solid #FF910033;border-radius:12px;padding:12px;font-size:10px;color:#FF9100;margin-bottom:12px}.c{width:80px;height:80px;border-radius:50%;background:#00E5FF33;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:40px}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s);let st=JSON.parse(localStorage.getItem('pai')||'null')||{pin:null,trash:[],prot:0,gb:0,done:false};const sv=()=>localStorage.setItem('pai',JSON.stringify(st));const fmt=b=>{const k=1024,s=['B','KB','MB','GB'],i=Math.floor(Math.log(b)/Math.log(k));return(b/Math.pow(k,i)).toFixed(1)+s[i]};const ico=t=>t==='image'?'📷':t==='pdf'?'📄':t==='doc'?'📝':'🎬';const F=[{id:1,n:'IMG_2847.jpg',s:2450000,t:'image',g:'43.85°N'},{id:2,n:'IMG_2848.jpg',s:3120000,t:'image',g:'43.32°N'},{id:3,n:'ugovor.pdf',s:456000,t:'pdf',a:'Amina K.'},{id:4,n:'IMG_2850.jpg',s:2870000,t:'image',g:'17.82°N'},{id:5,n:'napomene.docx',s:89000,t:'doc',a:'Amina K.'}];let cur='welcome',sel=new Set(),pend=[],pb='',ps='create',pc=null;function go(n){if(n===cur)return;cur=n;r()}function r(){const S={welcome:`<h1>🛡️ PurgeAI</h1><p class="cy" style="font-weight:900;letter-spacing:.15em;font-size:9px">100% OFFLINE</p><h2 style="margin-top:20px">Maksimalna sigurnost</h2><p>PurgeAI nikad ne pristupa internetu. Nema servera. Nema trackinga.</p><div class="card p"><div class="chk">Bez interneta</div><div class="chk">Bez servera</div><div class="chk">Bez cloud backup-a</div><div class="chk">Secure delete (DoD)</div></div><button class="btn" onclick="go('pin')">Započni demo</button>`,pin:`<h2>${ps==='create'?'Postavi PIN':'Potvrdi PIN'}</h2><p>${ps==='create'?'Unesi 4-cifreni PIN':'Unesi isti PIN ponovo'}</p><div class="warn">💡 Demo: unesi <b>1234</b></div><div style="display:flex;gap:12px;justify-content:center;margin:20px 0">${[0,1,2,3].map(i=>`<div style="width:14px;height:14px;border-radius:50%;background:${i<pb.length?'#00E5FF':'#1F242E'}"></div>`).join('')}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:250px;margin:0 auto">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<div></div>':`<button class="btn btn2" style="margin:0;padding:16px;font-size:22px;font-family:monospace" onclick="ph('${k}')">${k==='⌫'?'←':k}</button>`).join('')}</div><button class="btn btn2" style="margin-top:20px" onclick="skipPin()">Preskoči</button>`,home:`<h2>🛡️ PurgeAI</h2><p class="cy" style="font-weight:900;letter-spacing:.15em;font-size:9px">TRUST 100% · OFFLINE</p><div class="stat"><div><span>ZAŠTIĆENO</span><b class="cy">${st.prot}</b></div><div style="border-left:1px solid #1F242E;border-right:1px solid #1F242E"><span>U SMEĆU</span><b class="am">${st.trash.length}</b></div><div><span>GB</span><b>${st.gb.toFixed(1)}</b></div></div><div class="card p"><div class="chk">Nema internet dozvole</div><div class="chk">Sve ostaje u telefonu</div><div class="chk">Bez reklama</div><div class="chk">Bez pretplate</div></div>${st.trash.length?`<div class="warn" onclick="go('trash')" style="cursor:pointer">🗑️ Smeće: ${st.trash.length} · ${fmt(st.trash.reduce((a,t)=>a+t.s,0))}</div>`:''}<div class="row"><button class="btn btn2" onclick="go('trash')">🗑️ Smeće</button><button class="btn" onclick="go('pick')">➕ Odaberi</button></div>`,pick:`<h2>Odaberi fajlove</h2><div class="cy" style="font-size:10px;margin-bottom:10px">Demo · ${sel.size} odabrano</div>${F.map(f=>`<div class="item ${sel.has(f.id)?'s':''}" onclick="tg(${f.id})"><span style="font-size:20px">${ico(f.t)}</span><div style="flex:1"><b>${f.n}</b><div class="mu" style="font-size:9px">${fmt(f.s)} ${f.g?'<span class="am">· EXIF</span>':''}</div></div>${sel.has(f.id)?'<span class="cy" style="font-weight:900">✓</span>':''}</div>`).join('')}<div class="row"><button class="btn btn2" onclick="go('home')">← Nazad</button><button class="btn" onclick="proc()">Zaštiti</button></div>`,res:`<h2>Zaštita</h2><div class="warn">⚠️ ${pend.length} fajlova · metapodaci</div>${pend.map(f=>`<div class="item"><span style="font-size:20px">${ico(f.t)}</span><div style="flex:1"><b>${f.n}</b><div class="am" style="font-size:9px">${f.g||f.a||'Metadata'}</div></div></div>`).join('')}<div class="row"><button class="btn btn2" onclick="toTrash()">U Smeće</button><button class="btn btn3" onclick="perm()">Trajno</button></div><button class="btn btn2" style="margin-top:8px" onclick="go('pick')">← Nazad</button>`,trash:st.trash.length?`<h2>🗑️ Smeće</h2><div class="warn">Brisanje za ${Math.max(0,Math.ceil((new Date(st.trash[0].exp)-Date.now())/864e5))} dana</div>${st.trash.map(t=>`<div class="item"><span style="font-size:20px">${ico(t.t)}</span><div style="flex:1"><b>${t.n}</b><div class="mu" style="font-size:9px">${fmt(t.s)}</div></div><b class="am" style="font-family:monospace">${Math.max(0,Math.ceil((new Date(t.exp)-Date.now())/864e5))}d</b></div>`).join('')}<div class="row"><button class="btn btn2" onclick="restore()">↺ Vrati</button><button class="btn btn3" onclick="empty()">🗑️ Isprazni</button></div><button class="btn btn2" style="margin-top:8px" onclick="go('home')">← Nazad</button>`:`<h2>Smeće</h2><p>Nema fajlova.</p><button class="btn" onclick="go('home')">← Nazad</button>`,ok:`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div class="c">✓</div><h2 id="t1">Uspješno!</h2><p id="t2">Obrađeno.</p><div class="stat" style="width:100%"><div><span>UKUPNO</span><b class="cy" id="t3">0</b></div><div style="border-left:1px solid #1F242E"><span>VELIČINA</span><b class="am" id="t4">0</b></div><div></div></div></div><button class="btn" onclick="go('home')">Gotovo</button>`};$('#app').innerHTML=`<div style="flex:1;display:flex;flex-direction:column">${S[cur]||S.welcome}</div>`}
function ph(k){if(k==='⌫')pb=pb.slice(0,-1);else{if(pb.length>=4)return;pb+=k}const d=document.querySelectorAll('#app div[style*="border-radius:50%"]');d.forEach((e,i)=>e.style.background=i<pb.length?'#00E5FF':'#1F242E');if(pb.length===4)setTimeout(()=>{if(ps==='create'){pc=pb;pb='';ps='confirm';r()}else if(pb===pc){st.pin=pb;st.done=true;sv();pb='';ps='create';go('home')}else{pb='';ps='create';alert('PIN se ne poklapa');r()}},150)}
function skipPin(){st.done=true;sv();go('home')}
function tg(id){sel.has(id)?sel.delete(id):sel.add(id);r()}
function proc(){pend=F.filter(f=>sel.has(f.id));if(!pend.length)return alert('Odaberi bar jedan');go('res')}
function toTrash(){const now=Date.now();pend.forEach(f=>st.trash.push({id:now+Math.random(),n:f.n,s:f.s,t:f.t,exp:new Date(now+30*864e5).toISOString()}));st.prot+=pend.length;sv();showOk(pend.length+' u Smeću',pend.length,pend.reduce((a,f)=>a+f.s,0))}
function perm(){if(!confirm('⚠️ TRAJNO obrisati?'))return;if(st.pin&&prompt('PIN:')!==st.pin)return alert('Pogrešan PIN');st.prot+=pend.length;st.gb+=pend.reduce((a,f)=>a+f.s,0)/(1024**3);sv();showOk('Trajno obrisano',pend.length,pend.reduce((a,f)=>a+f.s,0))}
function restore(){if(!st.trash.length)return;if(!confirm('Vratiti?'))return;const n=st.trash.length;st.trash=[];sv();showOk('Vraćeno',n,0)}
function empty(){if(!st.trash.length)return;if(!confirm('⚠️ TRAJNO?'))return;if(st.pin&&prompt('PIN:')!==st.pin)return alert('Pogrešan PIN');const n=st.trash.length,s=st.trash.reduce((a,t)=>a+t.s,0);st.trash=[];st.gb+=s/(1024**3);sv();showOk('Ispražnjeno',n,s)}
function showOk(m,c,sz){go('ok');setTimeout(()=>{$('#t1').textContent=m;$('#t3').textContent=c;$('#t4').textContent=fmt(sz)},50)}
if(!st.done)r();else go('home');
</script></body></html>
