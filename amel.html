<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MgHub</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="welcome" class="auth-screen">
  <i class="fa-solid fa-car-side welcome-icon"></i>
  <h2>Dobrodošli u MgHub</h2>
  <p>Vaš digitalni auto-moto hub.</p>
  <button class="btn btn-primary btn-full" onclick="home()">Započni</button>
</div>

<div id="app" class="hidden">
  <header class="app-header">
    <div class="logo-area"><i class="fa-solid fa-shield-halved" style="color:#FF6A3D"></i> Mg<span>Hub</span> 3.1</div>
  </header>

  <main class="app-content">
    <div class="section-header"><h2>Otvoreni prozori <span class="count-badge">4</span></h2></div>

    <div class="bento-grid">
      <div class="card bento-card">
        <div class="card-title"><i class="fa-solid fa-wallet"></i> Novčanik</div>
        <div class="icon-grid">
          <div class="icon-item"><div class="icon-circle"><i class="fa-solid fa-car"></i></div><span>Auti</span></div>
          <div class="icon-item"><div class="icon-circle"><i class="fa-solid fa-motorcycle"></i></div><span>Moto</span></div>
          <div class="icon-item"><div class="icon-circle"><i class="fa-solid fa-truck"></i></div><span>Teretni</span></div>
          <div class="icon-item"><div class="icon-circle"><i class="fa-solid fa-tractor"></i></div><span>Agro</span></div>
          <div class="icon-item"><div class="icon-circle"><i class="fa-solid fa-gears"></i></div><span>Dijelovi</span></div>
          <div class="icon-item"><div class="icon-circle"><i class="fa-solid fa-screwdriver-wrench"></i></div><span>Servis</span></div>
        </div>
      </div>

      <div class="card bento-card">
        <div class="card-title"><i class="fa-brands fa-bitcoin"></i> Kripto</div>
        <div class="balance-large">4,850 <span>KM</span></div>
        <div class="crypto-row"><span>BTC <b style="color:#22D6A4">+2.4%</b></span><span>ETH <b style="color:#F85149">-0.8%</b></span></div>
      </div>

      <div class="card bento-card wide">
        <div class="card-title"><i class="fa-solid fa-coins"></i> Novčanik i Investicije</div>
        <div class="label-soft">Aggregate balance</div>
        <div class="balance-large">4,850,00 <span>KM</span></div>
      </div>

      <div class="card bento-card">
        <div class="card-title"><i class="fa-solid fa-shield"></i> Zaštita</div>
        <div class="fingerprint-wrapper">
          <i class="fa-solid fa-fingerprint fingerprint-icon"></i>
          <span class="fingerprint-label">AI Štit aktivan</span>
        </div>
      </div>

      <div class="card bento-card wide">
        <div class="card-title"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transakcije</div>
        <div class="transaction-item">
          <div class="tx-icon minus"><i class="fa-solid fa-arrow-up"></i></div>
          <div class="tx-info"><span class="tx-name">Michelin guma</span><span class="tx-date">Danas</span></div>
          <span class="tx-amount minus">-220 KM</span>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></button>
    <button class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>Shop</span></button>
    <button class="nav-item ai-btn"><div class="ai-btn-inner"><i class="fa-solid fa-robot"></i></div></button>
    <button class="nav-item"><i class="fa-solid fa-wallet"></i><span>Wallet</span></button>
    <button class="nav-item"><i class="fa-solid fa-user"></i><span>Profil</span></button>
  </nav>
</div>

<script>
function home() {
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}
</script>

</body>
</html>
