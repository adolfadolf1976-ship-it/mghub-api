<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MgHub</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0d1117;color:#e6edf3;font-family:'Manrope',sans-serif;font-size:14px;min-height:100vh}
.hidden{display:none!important}
h2{font-family:'Space Grotesk',sans-serif;font-weight:700}
.auth-screen{position:fixed;inset:0;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;gap:14px;z-index:100}
.auth-screen h2{font-size:22px;max-width:300px}
.auth-screen p{font-size:13px;color:#8b949e;max-width:280px;line-height:1.5}
.welcome-icon{font-size:56px;color:#FF6A3D;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:14px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;border:none;cursor:pointer;width:100%;max-width:300px;color:#fff}
.btn-primary{background:linear-gradient(135deg,#FF6A3D,#ff8c5f);box-shadow:0 4px 18px rgba(255,106,61,.35)}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(13,17,23,.9);border-bottom:1px solid #30363d;position:sticky;top:0;z-index:50}
.logo-area{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.logo-area span{color:#FF6A3D}
.logo-area small{font-size:9px;background:rgba(255,106,61,.15);color:#FF6A3D;padding:2px 6px;border-radius:4px}
.header-icons{display:flex;gap:14px;align-items:center}
.header-icons i{color:#8b949e;font-size:17px;cursor:pointer}
.bell-icon{position:relative}
.bell-badge{position:absolute;top:-6px;right:-6px;background:#F85149;color:#fff;font-size:9px;padding:1px 5px;border-radius:8px}
.avatar{width:28px;height:28px;border-radius:50%;border:2px solid #FF6A3D}
.app-content{padding:16px 16px 100px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-header h2{font-size:17px;display:flex;align-items:center;gap:6px}
.count-badge{background:rgba(255,106,61,.15);color:#FF6A3D;font-size:12px;padding:2px 8px;border-radius:6px}
.bento-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bento-card{background:rgba(30,34,43,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.bento-card.wide{grid-column:1/-1}
.card-title{font-size:10px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px;margin-bottom:10px}
.card-title i{color:#FF6A3D;font-size:11px}
.icon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.icon-item{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer}
.icon-circle{width:34px;height:34px;border-radius:50%;background:rgba(255,106,61,.12);border:1px solid rgba(255,106,61,.2);display:flex;align-items:center;justify-content:center;color:#FF6A3D;font-size:14px}
.icon-item span{font-size:8px;color:#8b949e;font-weight:600}
.balance-large{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin:4px 0 6px}
.balance-large span{font-size:11px;color:#8b949e;font-weight:400}
.crypto-row{display:flex;justify-content:space-between;font-size:9px;color:#8b949e;margin-bottom:6px}
.crypto-row b{font-weight:700;margin-left:3px}
.label-soft{font-size:9px;color:#8b949e;text-transform:uppercase;letter-spacing:.4px}
.fingerprint-wrapper{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
.fingerprint-icon{font-size:32px;color:#FF6A3D;text-shadow:0 0 20px rgba(255,106,61,.5)}
.fingerprint-label{font-size:8px;color:#22D6A4;font-weight:600}
.transaction-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.tx-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.tx-icon.minus{background:rgba(248,81,73,.15);color:#F85149}
.tx-info{display:flex;flex-direction:column;flex:1}
.tx-name{font-size:11px;font-weight:600}
.tx-date{font-size:9px;color:#8b949e}
.tx-amount{font-size:12px;font-weight:700}
.tx-amount.minus{color:#F85149}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(13,17,23,.95);backdrop-filter:blur(18px);border-top:1px solid #30363d;display:flex;align-items:center;justify-content:space-around;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:#8b949e;font-family:'Manrope',sans-serif;font-size:9px;font-weight:600;padding:8px 6px;cursor:pointer}
.nav-item i{font-size:19px}
.nav-item.active{color:#FF6A3D}
.nav-item.ai-btn{position:relative;top:-20px}
.ai-btn-inner{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#FF6A3D,#ff8c5f);display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(255,106,61,.55);border:3px solid #0d1117}
.ai-btn-inner i{color:#fff;font-size:22px}
</style>
</head>
<body>

<div id="welcome" class="auth-screen">
  <i class="fa-solid fa-car-side welcome-icon"></i>
  <h2>Dobrodošli u MgHub</h2>
  <p>Vaš digitalni auto-moto hub.</p>
  <button class="btn btn-primary" onclick="home()">Započni</button>
</div>

<div id="app" class="hidden">
  <header class="app-header">
    <div class="logo-area"><i class="fa-solid fa-shield-halved" style="color:#FF6A3D"></i> Mg<span>Hub</span> 3.1 <small>Ultra</small></div>
    <div class="header-icons">
      <i class="fa-solid fa-bell bell-icon" onclick="showMsg('Obavještenja')"><span class="bell-badge">2</span></i>
      <img src="https://i.pravatar.cc/100?img=11" class="avatar">
    </div>
  </header>

  <main class="app-content">
    <div class="section-header"><h2>Otvoreni prozori <span class="count-badge">4</span></h2></div>

    <div class="bento-grid">
      <div class="bento-card">
        <div class="card-title"><i class="fa-solid fa-wallet"></i> Novčanik</div>
        <div class="icon-grid">
          <div class="icon-item" onclick="showMsg('Automobili')"><div class="icon-circle"><i class="fa-solid fa-car"></i></div><span>Auti</span></div>
          <div class="icon-item" onclick="showMsg('Motocikli')"><div class="icon-circle"><i class="fa-solid fa-motorcycle"></i></div><span>Moto</span></div>
          <div class="icon-item" onclick="showMsg('Teretni')"><div class="icon-circle"><i class="fa-solid fa-truck"></i></div><span>Teretni</span></div>
          <div class="icon-item" onclick="showMsg('Agro')"><div class="icon-circle"><i class="fa-solid fa-tractor"></i></div><span>Agro</span></div>
          <div class="icon-item" onclick="showMsg('Dijelovi')"><div class="icon-circle"><i class="fa-solid fa-gears"></i></div><span>Dijelovi</span></div>
          <div class="icon-item" onclick="showMsg('Servis')"><div class="icon-circle"><i class="fa-solid fa-screwdriver-wrench"></i></div><span>Servis</span></div>
        </div>
      </div>

      <div class="bento-card">
        <div class="card-title"><i class="fa-brands fa-bitcoin"></i> Kripto</div>
        <div class="balance-large">4,850 <span>KM</span></div>
        <div class="crypto-row"><span>BTC <b style="color:#22D6A4">+2.4%</b></span><span>ETH <b style="color:#F85149">-0.8%</b></span></div>
      </div>

      <div class="bento-card wide">
        <div class="card-title"><i class="fa-solid fa-coins"></i> Novčanik i Investicije</div>
        <div class="label-soft">Aggregate balance</div>
        <div class="balance-large">4,850,00 <span>KM</span></div>
      </div>

      <div class="bento-card">
        <div class="card-title"><i class="fa-solid fa-shield"></i> Zaštita</div>
        <div class="fingerprint-wrapper">
          <i class="fa-solid fa-fingerprint fingerprint-icon"></i>
          <span class="fingerprint-label">AI Štit aktivan</span>
        </div>
      </div>

      <div class="bento-card wide">
        <div class="card-title"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transakcije</div>
        <div class="transaction-item">
          <div class="tx-icon minus"><i class="fa-solid fa-arrow-up"></i></div>
          <div class="tx-info"><span class="tx-name">Michelin guma</span><span class="tx-date">Danas</span></div>
          <span class="tx-amount minus">-220 KM</span>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showMsg('Home')"><i class="fa-solid fa-house"></i><span>Home</span></button>
    <button class="nav-item" onclick="showMsg('Shop')"><i class="fa-solid fa-cart-shopping"></i><span>Shop</span></button>
    <button class="nav-item ai-btn" onclick="openAI()"><div class="ai-btn-inner"><i class="fa-solid fa-robot"></i></div></button>
    <button class="nav-item" onclick="showMsg('Wallet')"><i class="fa-solid fa-wallet"></i><span>Wallet</span></button>
    <button class="nav-item" onclick="showMsg('Profil')"><i class="fa-solid fa-user"></i><span>Profil</span></button>
  </nav>
</div>

<script>
function home() {
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

function showMsg(text) {
  var t = document.createElement('div');
  t.innerText = text + ' — uskoro...';
  t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#21262d;color:#e6edf3;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:99999;border:1px solid #FF6A3D;';
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2000);
}

function openAI() {
  var o = document.createElement('div');
  o.id = 'aiBox';
  o.style.cssText = 'position:fixed;inset:0;background:rgba(10,13,22,.95);backdrop-filter:blur(20px);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;';
  o.innerHTML = '<div style="font-size:60px;color:#FF6A3D;margin-bottom:16px;"><i class="fa-solid fa-robot"></i></div><div style="background:#21262d;border:1px solid #30363d;border-radius:20px;padding:20px;text-align:center;color:#8b949e;max-width:300px;">AI Asistent<br><small style="color:#FF6A3D;">uskoro...</small></div><button onclick="this.parentElement.remove()" style="margin-top:24px;background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:12px 24px;border-radius:20px;font-family:inherit;cursor:pointer;">Zatvori</button>';
  document.body.appendChild(o);
}
</script>

</body>
</html>
